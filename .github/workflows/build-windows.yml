name: Build Windows

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get version from CMakeLists.txt
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^project(Sipper VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCOPY_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist/Windows/VST3
          mkdir -p dist/Windows/Standalone
          cp -r build/Sipper_artefacts/Release/VST3/Sipper.vst3 dist/Windows/VST3/ || true
          cp build/Sipper_artefacts/Release/Standalone/Sipper.exe dist/Windows/Standalone/ || true

      - name: Update Inno Setup version
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.version }}
          sed -i "s/AppVersion=.*/AppVersion=$VERSION/" installer/windows/desipper.iss
          sed -i "s/AppVerName=.*/AppVerName=De-Sipper v$VERSION/" installer/windows/desipper.iss
          sed -i "s/OutputBaseFilename=.*/OutputBaseFilename=De-Sipper-v$VERSION-Windows-Installer/" installer/windows/desipper.iss

      - name: Build Installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\windows\desipper.iss

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: DeSipper-Windows-VST3
          path: dist/Windows/VST3/

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: DeSipper-Windows-Standalone
          path: dist/Windows/Standalone/

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: DeSipper-Windows-Installer
          path: dist/Windows/Installer/De-Sipper-*.exe

      - name: Create Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd dist/Windows
          7z a -tzip ../../DeSipper-Windows.zip VST3/ Standalone/

      - name: Upload Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DeSipper-Windows.zip
            dist/Windows/Installer/De-Sipper-*.exe
